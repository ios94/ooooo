name: Apply Redesign Zip
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy new Feather folder from zip
        run: |
          test -f ashteipa-redesign.zip
          mkdir tmp_unzip
          unzip -q ashteipa-redesign.zip -d tmp_unzip
          rsync -a tmp_unzip/ashteipa-main/Feather/ Feather/
          rm -rf tmp_unzip ashteipa-redesign.zip
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Apply colorful redesign" || echo "nothing to commit"
          git push
