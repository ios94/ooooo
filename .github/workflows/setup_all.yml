name: Setup All Files
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy all project files from zip
        run: |
          test -f ashteipa-redesign.zip
          mkdir tmp_unzip
          unzip -q ashteipa-redesign.zip -d tmp_unzip
          rsync -a --exclude '.github' --exclude '.gitmodules' --exclude 'Zsign' --exclude 'IDeviceKitten' tmp_unzip/ashteipa-main/ ./
          rm -rf tmp_unzip ashteipa-redesign.zip

      - name: Get Zsign and IDeviceKitten from ios94/ashteipa
        run: |
          rm -rf Zsign IDeviceKitten tmp_src
          git clone --recursive https://github.com/ios94/ashteipa tmp_src
          cp -r tmp_src/Zsign Zsign
          cp -r tmp_src/IDeviceKitten IDeviceKitten
          rm -rf tmp_src
          test -n "$(ls -A Zsign)"
          test -n "$(ls -A IDeviceKitten)"
          find Zsign IDeviceKitten -name .git -prune -exec rm -rf {} +
          find Zsign IDeviceKitten -name .gitmodules -delete

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Add all project files" || echo "nothing to commit"
          git push
